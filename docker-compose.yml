services:
  tts:
    build: .
    image: coral-chatterbox-server
    container_name: coral-chatterbox
    ports:
      - "8000:8000"
    volumes:
      - ./voices:/voices
      - ./src:/app/src
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
    environment:
      VARIANT: ${VARIANT:-multilingual}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      DEFAULT_VOICE: ${DEFAULT_VOICE:-}
      REPO_ID: ${REPO_ID:-CoRal-project/roest-v3-chatterbox-500m}
      MODEL_DIR: ${MODEL_DIR:-}
      API_KEY: ${API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      NNPACK_DISABLE: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Requires NVIDIA Container Toolkit on the host.
